# Manual publish of the four public packages. Do not run this workflow until publish is approved.
# It is workflow_dispatch only: pull requests and pushes do not start it.
# The job passes secrets.NPM_TOKEN as NODE_AUTH_TOKEN. Each package is skipped when that
# exact version is already on the registry, so a re-run after a partial failure is safe.

name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish @lessspam/widget
        run: node scripts/publish-missing.mjs --publish packages/widget

      - name: Publish @lessspam/server
        run: node scripts/publish-missing.mjs --publish packages/server-node

      - name: Publish @lessspam/agent
        run: node scripts/publish-missing.mjs --publish packages/agent

      - name: Publish @lessspam/mcp
        run: node scripts/publish-missing.mjs --publish packages/mcp
