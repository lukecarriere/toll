name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Copy lint and tests/copy.test.ts read titles after fa12195. A depth-1 checkout
          # hides that commit, so the title range is empty and the lint test fails.
          fetch-depth: 0

      # Squash merge #22 dropped the conservation commits. The guard test reads them.
      - name: Fetch the Cashu receive branch
        run: git fetch --no-tags origin cursor/edge-cashu-receive-8ea2

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: sodium, xml, mbstring
          coverage: none
          tools: composer

      - name: Install PHP dependencies
        working-directory: packages/server-php
        run: composer install --no-interaction --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      - name: Cashu conservation mutants
        run: node scripts/mutate-cashu-conservation.mjs

      - name: Cashu token mutants
        run: node scripts/mutate-cashu-token.mjs
