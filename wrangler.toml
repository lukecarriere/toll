# toll-site: the static site, the work check, and Cashu receive.
# The allowlist is the only mint the worker will call. Do not deploy from an agent;
# deploy happens after an independent verifier passes.
# From a clean checkout, after `npm ci` and `npm run build`:
#   npx wrangler deploy
# Production is lessspam.dev and www.lessspam.dev, attached as Workers custom domains (Cloudflare
# creates their DNS records on deploy). workers_dev stays on as a fallback for now.
name = "toll-site"
main = "packages/edge-cf/dist/site.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

routes = [
  { pattern = "lessspam.dev", custom_domain = true },
  { pattern = "www.lessspam.dev", custom_domain = true },
]

[assets]
directory = "website/dist"
binding = "ASSETS"
html_handling = "drop-trailing-slash"
not_found_handling = "none"
# The worker runs first so www.<apex> can 308 to the apex for every path. Static pages
# and files (/, /docs/*, /pricing, sitemap.xml, llms.txt, robots.txt, and the rest of
# the built site) are then served by ASSETS and are not gated. Other paths, including
# POST /search, stay on the worker.
run_worker_first = true

[vars]
TOLL_SITE_URL = "https://lessspam.dev"
SITE_ID = "site_demo"
WRITE_PATHS = '["/demo/contact"]'
# Cashu receive. The path is part of the mint. No new binding: proofs live in TOLL_STORE.
CASHU_MINTS = '["https://mint.minibits.cash/Bitcoin"]'
# Production quote offer (docs/settlement.md section 18). Cashu stays the first offer. Only "1" turns it on.
L402_ENABLED = "1"
# SITE_SECRET is a Worker secret (local: .dev.vars, copied from .dev.vars.example). Never commit it.

# Mint-quote sweep (docs/settlement.md): every 30 minutes, at most 40 mint calls and about 24 s per run.
[triggers]
crons = ["*/30 * * * *"]

[[durable_objects.bindings]]
name = "TOLL_STORE"
class_name = "TollStoreDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TollStoreDO"]
